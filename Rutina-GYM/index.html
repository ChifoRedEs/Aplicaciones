<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Rutina de Gimnasio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101216;
    --surface:#1A1D22;
    --surface-2:#22262C;
    --surface-3:#2B3037;
    --border:#31363E;
    --text:#EDEFF2;
    --text-muted:#868E99;
    --danger:#FF6161;
    --empuje:#FFB020;
    --traccion:#4DA6FF;
    --pierna:#3ED17A;
    --radius:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  body{padding-bottom:96px;}
  #app{max-width:540px;margin:0 auto;min-height:100vh;position:relative;}
  h1,h2,h3{font-family:'Oswald',sans-serif;font-weight:600;margin:0;letter-spacing:.2px;}
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  button:active{transform:scale(.96);}
  input:focus,button:focus-visible{outline:2px solid var(--gc,#4DA6FF);outline-offset:1px;}

  /* ---- topbar ---- */
  #topbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg),var(--bg)) padding-box;border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:10px;overflow:hidden;}
  #topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--gc,transparent);opacity:.9;transition:background .25s;}
  .back{display:none;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:18px;width:34px;height:34px;border-radius:50%;line-height:1;flex-shrink:0;align-items:center;justify-content:center;}
  .back.show{display:flex;}
  #topTitle{font-size:19px;}
  #topSub{font-size:12px;color:var(--text-muted);margin-top:2px;}

  .view{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* ---- calendar ---- */
  #calendarScreen{padding:18px 16px;}
  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .month-nav button{background:var(--surface);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:15px;transition:background .15s;}
  .month-nav button:hover{background:var(--surface-3);}
  .month-nav .month-label{font-family:'Oswald',sans-serif;font-size:18px;text-transform:capitalize;}
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
  .weekdays span{text-align:center;font-size:11px;color:var(--text-muted);font-weight:600;}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .day-cell{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:9px;background:var(--surface);border:1px solid transparent;font-size:14px;color:var(--text);transition:transform .12s,background .12s;}
  .day-cell:active{transform:scale(.92);}
  .day-cell.empty{background:none;}
  .day-cell.today{border-color:var(--text-muted);}
  .day-cell .day-dots{display:flex;gap:3px;margin-top:3px;}
  .day-cell .dot{width:6px;height:6px;border-radius:50%;}
  .day-cell.has-workout{font-weight:600;background:var(--surface-2);}
  .legend{display:flex;gap:16px;margin-top:20px;font-size:12px;color:var(--text-muted);flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:6px;}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .manage-link{display:block;width:100%;text-align:center;margin-top:22px;background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-size:13px;padding:12px;border-radius:10px;}

  /* ---- manage screen ---- */
  #manageScreen{padding:16px;display:none;}
  .manage-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
  .manage-section h3{font-size:14px;margin-bottom:12px;}
  .form-field{margin-bottom:10px;}
  .form-field label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
  .form-field input,.form-field select{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:11px;font-size:14px;font-family:'Inter',sans-serif;}
  .form-field input:focus,.form-field select:focus{outline:none;border-color:var(--traccion);}
  .btn-add{width:100%;padding:13px;border-radius:10px;font-size:14px;font-weight:600;border:none;background:var(--traccion);color:#101216;margin-top:4px;}
  .custom-list-group{margin-bottom:10px;}
  .custom-list-group h4{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin:0 0 6px;}
  .custom-item{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-bottom:6px;gap:10px;}
  .custom-item .ci-name{font-size:13.5px;font-weight:600;}
  .custom-item .ci-muscles{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .custom-item .ci-del{background:none;border:none;color:var(--danger);font-size:16px;flex-shrink:0;padding:4px 6px;}
  .empty-hint{font-size:12.5px;color:var(--text-muted);text-align:center;padding:10px 0;}
  .btn-export{width:100%;padding:12px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--surface-2);color:var(--text);}
  .export-box{margin-top:10px;}
  .export-box textarea{width:100%;min-height:150px;background:#0B0D10;border:1px solid var(--border);border-radius:8px;color:#8BE28B;font-family:'JetBrains Mono',monospace;font-size:11px;padding:10px;resize:vertical;}
  .export-hint{font-size:11px;color:var(--text-muted);margin-top:6px;line-height:1.5;}
  .btn-copy{margin-top:8px;width:100%;padding:10px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid var(--border);background:var(--surface-3);color:var(--text);}
  #settingsScreen{padding:16px;display:none;}
  .danger-zone{border-color:rgba(255,97,97,.4);}
  .danger-zone h3{color:var(--danger);}
  .btn-delete-all{width:100%;padding:13px;border-radius:10px;font-size:14px;font-weight:600;border:1px solid rgba(255,97,97,.4);background:none;color:var(--danger);margin-top:4px;}
  .settings-hint{font-size:12.5px;color:var(--text-muted);line-height:1.6;margin-bottom:14px;}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--surface-3);color:var(--text);border:1px solid var(--border);padding:11px 18px;border-radius:30px;font-size:13px;font-weight:600;z-index:60;max-width:88%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4);}

  /* ---- overlay / sheet ---- */
  .overlay{position:fixed;inset:0;background:rgba(8,9,11,.6);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:30;animation:fadeIn .15s ease;}
  .sheet{background:var(--surface);width:100%;max-width:540px;border-radius:20px 20px 0 0;padding:22px 18px 28px;border-top:1px solid var(--border);animation:slideUp .22s ease;}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet h2{font-size:17px;margin-bottom:2px;}
  .sheet .date-str{color:var(--text-muted);font-size:13px;margin-bottom:16px;text-transform:capitalize;}
  .group-btn{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--surface-2);border:1px solid var(--border);border-left:4px solid var(--gc);color:var(--text);padding:15px;border-radius:12px;margin-bottom:10px;text-align:left;transition:background .15s;}
  .group-btn:hover{background:var(--surface-3);}
  .group-btn h3{font-size:16px;}
  .group-btn p{margin:2px 0 0;font-size:12px;color:var(--text-muted);}
  .group-btn .arrow{color:var(--text-muted);font-size:18px;}
  .sheet-existing{background:var(--surface-2);border-left:4px solid var(--gc);border-radius:12px;padding:15px;margin-bottom:14px;}
  .sheet-existing h3{font-size:16px;color:var(--gc);}
  .sheet-existing p{margin:4px 0 0;font-size:12px;color:var(--text-muted);}
  .sheet-row{display:flex;gap:10px;}
  .sheet-row button{flex:1;padding:13px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid var(--border);}
  .btn-primary{background:var(--gc);color:#101216;border:none !important;}
  .btn-ghost{background:none;color:var(--text);}
  .btn-danger{background:none;color:var(--danger);border-color:rgba(255,97,97,.4) !important;}
  .cancel-link{display:block;text-align:center;color:var(--text-muted);font-size:13px;margin-top:14px;background:none;border:none;width:100%;padding:6px;}
  .session-row{display:flex;align-items:stretch;background:var(--surface-2);border:1px solid var(--border);border-left:4px solid var(--gc);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .session-row-main{flex:1;display:flex;align-items:center;justify-content:space-between;padding:14px 15px;cursor:pointer;gap:8px;}
  .session-row-main h3{font-size:15px;}
  .session-row-main p{margin:2px 0 0;font-size:12px;color:var(--text-muted);}
  .session-del{background:none;border:none;border-left:1px solid var(--border);color:var(--danger);font-size:15px;padding:0 14px;flex-shrink:0;}

  /* ---- exercise selection screen ---- */
  #selectionScreen{padding:16px;display:none;}
  .select-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;transition:border-color .15s,background .15s;}
  .select-row.checked-row{border-left-color:var(--gc);background:var(--surface-2);}
  .bottom-actions .btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .delete-session-btn{display:block;width:100%;margin-top:10px;padding:12px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid rgba(255,97,97,.35);background:none;color:var(--danger);}

  /* ---- workout screen ---- */
  #workoutScreen{padding:16px;display:none;}
  .group-banner{border-left:4px solid var(--gc);background:var(--surface);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
  .group-banner-top{display:flex;justify-content:space-between;align-items:center;}
  .group-banner h2{color:var(--gc);font-size:19px;}
  .group-banner p{margin:2px 0 0;font-size:12px;color:var(--text-muted);}
  .progress-pill{font-size:12px;background:var(--surface-2);padding:5px 11px;border-radius:20px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;}
  .progress-track{margin-top:10px;height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--gc);border-radius:3px;transition:width .3s ease;}

  .list-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .muscle-filter{background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:12px;padding:7px 9px;border-radius:8px;font-family:'Inter',sans-serif;flex:1;max-width:200px;}
  .toggle-all{font-size:12px;color:var(--text-muted);background:none;border:none;text-decoration:underline;padding:4px;flex-shrink:0;}

  .exercise-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--gc);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .muscle-header{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;color:var(--gc);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--gc);}
  .muscle-header:first-child{margin-top:0;}
  .equip-header{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin:4px 0 8px 2px;}
  .ex-head{display:flex;align-items:center;gap:10px;padding:13px 14px;}
  .chevron{color:var(--text-muted);font-size:12px;transition:transform .2s;flex-shrink:0;}
  .exercise-card.open .chevron{transform:rotate(180deg);}
  .ex-headtext{flex:1;min-width:0;}
  .ex-name{font-size:14.5px;font-weight:600;line-height:1.3;}
  .ex-last{font-size:11px;color:var(--text-muted);margin-top:2px;font-family:'JetBrains Mono',monospace;}
  .checkbox{width:25px;height:25px;flex-shrink:0;border-radius:7px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;background:var(--surface-2);font-size:14px;transition:background .15s,border-color .15s,transform .15s;}
  .checkbox.checked{background:var(--gc);border-color:var(--gc);color:#101216;font-weight:700;transform:scale(1.05);}

  .ex-details-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease;}
  .ex-details-inner{overflow:hidden;}
  .exercise-card.open .ex-details-wrap{grid-template-rows:1fr;}
  .ex-details{padding:0 14px 14px;}
  .ex-muscles{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
  .tag{font-size:10.5px;padding:3px 8px;border-radius:20px;font-weight:600;white-space:nowrap;}
  .tag-primary{background:var(--gc);color:#101216;}
  .tag-secondary{background:var(--surface-3);color:var(--text-muted);border:1px solid var(--border);}
  .ex-body{flex:1;min-width:0;}
  .ex-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;}
  .field label{display:block;font-size:9.5px;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;}
  .field input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:9px 4px;text-align:center;font-size:15px;font-family:'JetBrains Mono',monospace;}
  .field input:focus{outline:none;border-color:var(--gc);}
  .ex-actions{margin-top:9px;display:flex;justify-content:flex-end;}
  .rest-trigger{font-size:11.5px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);padding:6px 11px;border-radius:20px;transition:background .15s;}
  .rest-trigger:active{background:var(--gc);color:#101216;border-color:var(--gc);}

  .bottom-actions{display:flex;gap:10px;margin-top:8px;}
  .bottom-actions button{flex:1;padding:14px;border-radius:12px;font-size:14px;font-weight:600;border:none;}

  /* ---- rest timer bar ---- */
  #restBar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:10px 16px;display:none;align-items:center;justify-content:space-between;gap:12px;z-index:40;max-width:540px;margin:0 auto;box-shadow:0 -4px 16px rgba(0,0,0,.3);}
  #restBar .time{font-family:'JetBrains Mono',monospace;font-size:25px;font-weight:700;min-width:66px;}
  #restBar .rest-ctrls{display:flex;gap:6px;align-items:center;}
  #restBar button{background:var(--surface-2);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:9px;font-size:13px;}
  #restBar .play{background:var(--empuje);color:#101216;border:none;width:42px;height:42px;font-size:16px;border-radius:50%;}
  #restBar .label{font-size:11px;color:var(--text-muted);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="back" id="backBtn">‹</button>
    <div>
      <h1 id="topTitle">Rutina de Gimnasio</h1>
      <div id="topSub">Elige un día para entrenar</div>
    </div>
  </header>

  <main id="calendarScreen" class="view">
    <div class="month-nav">
      <button id="prevMonth">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="nextMonth">›</button>
    </div>
    <div class="weekdays"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
    <div class="days" id="daysGrid"></div>
    <div class="legend">
      <span><i style="background:var(--empuje)"></i>Empuje</span>
      <span><i style="background:var(--traccion)"></i>Tracción</span>
      <span><i style="background:var(--pierna)"></i>Pierna</span>
    </div>
    <button class="manage-link" id="manageLinkBtn">⚙ Gestionar ejercicios personalizados</button>
    <button class="manage-link" id="settingsLinkBtn">🛠️ Ajustes</button>
  </main>

  <main id="workoutScreen" class="view"></main>
  <main id="selectionScreen" class="view"></main>
  <main id="manageScreen" class="view"></main>
  <main id="settingsScreen" class="view"></main>
</div>
<input type="file" id="importFileInput" accept="application/json,.json" style="display:none;">

<div class="overlay" id="dayPanel" style="display:none;"><div class="sheet" id="sheetContent"></div></div>

<div id="restBar">
  <div><div class="label" id="restLabel">Descanso</div><div class="time mono" id="restTime">00:50</div></div>
  <div class="rest-ctrls">
    <button id="restMinus">−10</button>
    <button class="play" id="restToggle">▶</button>
    <button id="restPlus">+10</button>
    <button id="restClose">✕</button>
  </div>
</div>

<script>
(function(){
  const EQUIP_LABELS = { maquina:'Máquina', libre:'Peso libre', calistenia:'Calistenia' };
  const SUBGROUPS_BY_GROUP = {
    empuje: ['Pecho','Hombro','Tríceps'],
    traccion: ['Espalda','Bíceps','Lumbar','Abdominal'],
    pierna: ['Cuádriceps','Femoral','Gemelos','Aductores / Abductores']
  };

  const GROUPS = {
    empuje: {
      label:'Empuje', sub:'Pecho · Hombro · Tríceps', color:'#FFB020',
      subgroups:[
        { name:'Pecho', groups:{
          maquina:[
            ['Press de pecho convergente en máquina','Pecho','Tríceps, Hombro anterior'],
            ['Aperturas / Pec Deck en máquina','Pecho',''],
            ['Cruces en polea alta','Pecho','']
          ],
          libre:[
            ['Press de banca (barra libre o Multipower/Smith)','Pecho','Tríceps, Hombro anterior'],
            ['Press inclinado con mancuernas','Pecho superior','Hombro anterior, Tríceps']
          ],
          calistenia:[
            ['Flexiones de pecho','Pecho','Tríceps, Core']
          ]
        }},
        { name:'Hombro', groups:{
          maquina:[
            ['Press de hombros sentado en máquina','Hombro','Tríceps'],
            ['Elevaciones laterales en máquina o polea baja','Hombro lateral','Trapecio'],
            ['Pájaros en máquina / Pec Deck invertido','Hombro posterior','Espalda alta']
          ],
          libre:[
            ['Press militar sentado con mancuernas','Hombro','Tríceps'],
            ['Press militar con barra','Hombro','Tríceps'],
            ['Press Arnold con mancuernas','Hombro','Tríceps'],
            ['Elevaciones frontales con mancuernas o disco','Hombro anterior','Pecho superior'],
            ['Elevaciones laterales con mancuernas','Hombro lateral','Trapecio']
          ],
          calistenia:[]
        }},
        { name:'Tríceps', groups:{
          maquina:[
            ['Extensión de tríceps en polea alta con cuerda','Tríceps',''],
            ['Máquina de fondos para tríceps / Triceps Press','Tríceps','Pecho, Hombro']
          ],
          libre:[
            ['Press francés con barra EZ o mancuernas','Tríceps',''],
            ['Extensión de tríceps por encima de la cabeza con mancuerna','Tríceps','']
          ],
          calistenia:[
            ['Fondos en paralelas / Dips','Tríceps','Pecho, Hombro']
          ]
        }}
      ]
    },
    traccion: {
      label:'Tracción', sub:'Espalda · Bíceps · Lumbar · Abdomen', color:'#4DA6FF',
      subgroups:[
        { name:'Espalda', groups:{
          maquina:[
            ['Jalón al pecho / Lat Pulldown','Dorsal ancho','Bíceps'],
            ['Remo sentado con apoyo en el pecho','Espalda media','Bíceps'],
            ['Remo en polea baja con agarre estrecho','Espalda media','Bíceps'],
            ['Pull-over en polea alta','Dorsal ancho','Pecho, Tríceps']
          ],
          libre:[
            ['Remo con mancuerna a una mano apoyado en banco','Dorsal ancho','Bíceps'],
            ['Remo con barra (barra libre o Multipower)','Espalda media','Bíceps, Lumbar']
          ],
          calistenia:[
            ['Dominadas o dominadas asistidas','Dorsal ancho','Bíceps']
          ]
        }},
        { name:'Bíceps', groups:{
          maquina:[
            ['Curl de bíceps en máquina predicador','Bíceps','Antebrazo'],
            ['Curl de bíceps en polea baja con barra recta','Bíceps','Antebrazo']
          ],
          libre:[
            ['Curl de bíceps con barra','Bíceps','Antebrazo'],
            ['Curl alterno con mancuernas','Bíceps','Antebrazo'],
            ['Curl martillo con mancuernas','Bíceps, Braquial','Antebrazo']
          ],
          calistenia:[
            ['Dominadas supinas / Chin-ups','Bíceps','Dorsal ancho']
          ]
        }},
        { name:'Lumbar', groups:{
          maquina:[
            ['Extensión lumbar en máquina sentada','Lumbar','Glúteo']
          ],
          libre:[
            ['Peso muerto convencional (barra libre o Multipower)','Lumbar, Femoral','Glúteo, Espalda'],
            ['Buenos días con barra','Lumbar','Femoral, Glúteo']
          ],
          calistenia:[

  const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const WEEKDAYS_LONG = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  let today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();
  let monthDotsCache = {};
  let currentDate = null, currentGroup = null, currentData = null;
  let saveTimer = null;

  let restSeconds = 50, restRemaining = 50, restRunning = false, restInterval = null, audioCtx = null;

  const pad = n => String(n).padStart(2,'0');
  const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const todayStr = fmtDate(today);

  const calendarScreen = document.getElementById('calendarScreen');
  const workoutScreen = document.getElementById('workoutScreen');
  const backBtn = document.getElementById('backBtn');
  const topTitle = document.getElementById('topTitle');
  const topSub = document.getElementById('topSub');

  // ---------------- storage helpers (browser localStorage — works fully offline in Chrome) ----------------
  function storageGet(key){ try{ return localStorage.getItem(key); }catch(e){ console.warn('storage no disponible', e); return null; } }
  function storageSet(key, value){ try{ localStorage.setItem(key, value); return true; }catch(e){ console.warn('no se pudo guardar', e); return false; } }
  function storageDelete(key){ try{ localStorage.removeItem(key); return true; }catch(e){ return false; } }
  function storageListPrefix(prefix){ try{ return Object.keys(localStorage).filter(k => k.startsWith(prefix)); }catch(e){ return []; } }

  // ---------------- custom exercises (user-added, merged with the built-in list) ----------------
  function getCustomExercises(){
    try{ return JSON.parse(storageGet('customExercises') || '[]'); }catch(e){ return []; }
  }
  function saveCustomExercises(arr){ storageSet('customExercises', JSON.stringify(arr)); }
  function addCustomExercise(group, subgroup, equip, name, primary, secondary){
    const arr = getCustomExercises();
    arr.push({ id:`custom-${Date.now()}`, group, subgroup, equip, name, primary, secondary: secondary||'' });
    saveCustomExercises(arr);
  }
  function deleteCustomExercise(id){
    saveCustomExercises(getCustomExercises().filter(c => c.id !== id));
  }
  // Flattens the nested group → subgroup → equipment structure into an ordered list,
  // inserting any matching custom exercises right after the built-in ones of the same bucket.
  function getAllExercisesForGroup(group){
    const custom = getCustomExercises().filter(c => c.group === group);
    const list = [];
    GROUPS[group].subgroups.forEach((sg, sgi) => {
      ['maquina','libre','calistenia'].forEach(equip => {
        (sg.groups[equip] || []).forEach(([name, primary, secondary], i) => {
          list.push({ id:`${group}-${sgi}-${equip}-${i}`, name, primary, secondary, subgroup:sg.name, equip });
        });
        custom.filter(c => c.subgroup === sg.name && c.equip === equip).forEach(c => {
          list.push({ id:c.id, name:c.name, primary:c.primary, secondary:c.secondary, subgroup:sg.name, equip });
        });
      });
    });
    return list;
  }

  // ---------------- sessions (a day can now have more than one) ----------------
  function sessionKey(date, id){ return `session:${date}:${id}`; }
  function getSessionsForDate(date){
    return storageListPrefix(`session:${date}:`).map(k => {
      try{ return JSON.parse(storageGet(k)); }catch(e){ return null; }
    }).filter(Boolean).sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
  }
  function saveSession(session){ storageSet(sessionKey(session.date, session.id), JSON.stringify(session)); }
  function deleteSession(date, id){ storageDelete(sessionKey(date, id)); }

  // One-time migration: old versions stored a single "workout:{date}" per day.
  function migrateLegacyWorkouts(){
    storageListPrefix('workout:').forEach(k => {
      const raw = storageGet(k);
      if(!raw) return;
      try{
        const data = JSON.parse(raw);
        const date = k.replace('workout:','');
        const id = `legacy-${Date.now()}-${Math.floor(Math.random()*1000)}`;
        saveSession({ id, date, group:data.group, name:`Sesión ${GROUPS[data.group].label}`, exercises:data.exercises, createdAt:data.updatedAt||Date.now(), updatedAt:data.updatedAt||Date.now() });
        storageDelete(k);
      }catch(e){}
    });
  }

  // ---------------- calendar ----------------
  function loadMonthDots(year, month){
    const prefix = `session:${year}-${pad(month+1)}`;
    const keys = storageListPrefix(prefix);
    const dots = {};
    keys.forEach(k => {
      const date = k.split(':')[1];
      const raw = storageGet(k);
      if(raw){
        try{
          const s = JSON.parse(raw);
          if(!dots[date]) dots[date] = new Set();
          dots[date].add(s.group);
        }catch(e){}
      }
    });
    monthDotsCache = dots;
  }

  function renderCalendar(){
    document.getElementById('monthLabel').textContent = `${MONTHS[viewMonth]} ${viewYear}`;
    loadMonthDots(viewYear, viewMonth);
    const grid = document.getElementById('daysGrid');
    grid.innerHTML = '';
    const firstDay = new Date(viewYear, viewMonth, 1);
    let startOffset = firstDay.getDay() - 1;
    if(startOffset < 0) startOffset = 6;
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();

    for(let i=0;i<startOffset;i++){
      const empty = document.createElement('div');
      empty.className = 'day-cell empty';
      grid.appendChild(empty);
    }
    for(let day=1; day<=daysInMonth; day++){
      const dateStr = `${viewYear}-${pad(viewMonth+1)}-${pad(day)}`;
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if(dateStr === todayStr) cell.classList.add('today');
      const groupsToday = monthDotsCache[dateStr] ? Array.from(monthDotsCache[dateStr]) : [];
      let dotHtml = '';
      if(groupsToday.length){ cell.classList.add('has-workout'); dotHtml = `<div class="day-dots">${groupsToday.map(gk => `<span class="dot" style="background:${GROUPS[gk].color}"></span>`).join('')}</div>`; }
      cell.innerHTML = `<span>${day}</span>${dotHtml}`;
      cell.addEventListener('click', () => openDayPanel(dateStr));
      grid.appendChild(cell);
    }
  }

  document.getElementById('prevMonth').addEventListener('click', () => { viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;} renderCalendar(); });
  document.getElementById('nextMonth').addEventListener('click', () => { viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;} renderCalendar(); });

  function formatDateLong(dateStr){
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return `${WEEKDAYS_LONG[dt.getDay()]}, ${d} de ${MONTHS[m-1]} de ${y}`;
  }

  function openDayPanel(dateStr){
    const sessions = getSessionsForDate(dateStr);
    sheetContent.style.removeProperty('--gc');
    const rowsHtml = sessions.map(s => {
      const g = GROUPS[s.group];
      const done = s.exercises.filter(e=>e.checked).length;
      const time = new Date(s.createdAt || Date.now()).toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
      return `
        <div class="session-row" style="--gc:${g.color}">
          <div class="session-row-main" data-action="open" data-id="${s.id}">
            <div><h3 style="color:${g.color}">${s.name}</h3><p>${time} · ${done}/${s.exercises.length} ejercicios</p></div>
            <span class="arrow">›</span>
          </div>
          <button class="session-del" data-action="delete-session" data-id="${s.id}">✕</button>
        </div>`;
    }).join('');
    sheetContent.innerHTML = `
      <h2>${formatDateLong(dateStr)}</h2>
      ${sessions.length
        ? `<div class="date-str">${sessions.length} sesión${sessions.length>1?'es':''} este día</div>${rowsHtml}`
        : `<div class="date-str">Aún no hay ninguna sesión este día</div>`}
      <div class="sheet-row" style="margin-top:6px;"><button class="btn-primary" style="background:var(--traccion)" data-action="new">+ Nueva sesión</button></div>
      <button class="cancel-link" data-action="cancel">Cancelar</button>`;
    sheetContent.querySelectorAll('[data-action="open"]').forEach(el => {
      el.addEventListener('click', () => { const id = el.dataset.id; closeDayPanel(); goToSession(dateStr, id); });
    });
    sheetContent.querySelectorAll('[data-action="delete-session"]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = el.dataset.id;
        const s = sessions.find(x => x.id === id);
        if(s && confirm(`¿Eliminar "${s.name}"?`)){ deleteSession(dateStr, id); openDayPanel(dateStr); }
      });
    });
    sheetContent.querySelector('[data-action="new"]').addEventListener('click', () => renderGroupPicker(dateStr));
    sheetContent.querySelector('[data-action="cancel"]').addEventListener('click', closeDayPanel);
    dayPanel.style.display = 'flex';
  }

  function renderGroupPicker(dateStr){
    sheetContent.innerHTML = `
      <h2>${formatDateLong(dateStr)}</h2>
      <div class="date-str">¿Qué vas a entrenar en esta sesión?</div>
      ${Object.entries(GROUPS).map(([key,g]) => `
        <button class="group-btn" style="--gc:${g.color}" data-group="${key}">
          <div><h3 style="color:${g.color}">${g.label}</h3><p>${g.sub}</p></div><span class="arrow">›</span>
        </button>`).join('')}
      <button class="cancel-link" data-action="cancel">Cancelar</button>`;
    sheetContent.querySelectorAll('.group-btn').forEach(btn => {
      btn.addEventListener('click', () => { const group = btn.dataset.group; closeDayPanel(); goToSelection(dateStr, group, null); });
    });
    sheetContent.querySelector('[data-action="cancel"]').addEventListener('click', closeDayPanel);
  }

  function closeDayPanel(){ dayPanel.style.display = 'none'; }
  dayPanel.addEventListener('click', (e) => { if(e.target === dayPanel) closeDayPanel(); });

  // ---------------- exercise selection screen (pick which exercises make up a session) ----------------
  let selectionState = { dateStr:null, group:null, editingId:null, selectedIds:new Set() };

  function goToSelection(dateStr, group, editingId){
    selectionState = { dateStr, group, editingId, selectedIds:new Set() };
    if(editingId){
      const existing = JSON.parse(storageGet(sessionKey(dateStr, editingId)) || 'null');
      if(existing) existing.exercises.forEach(e => selectionState.selectedIds.add(e.id));
    }
    calendarScreen.style.display = 'none';
    document.getElementById('manageScreen').style.display = 'none';
    document.getElementById('settingsScreen').style.display = 'none';
    workoutScreen.style.display = 'none';
    document.getElementById('selectionScreen').style.display = 'block';
    backBtn.classList.add('show');
    topTitle.textContent = `Elegir ejercicios · ${GROUPS[group].label}`;
    topSub.textContent = formatDateLong(dateStr);
    document.getElementById('topbar').style.setProperty('--gc', GROUPS[group].color);
    renderSelection();
  }

  function renderSelection(){
    const { group, selectedIds } = selectionState;
    const g = GROUPS[group];
    const defs = getAllExercisesForGroup(group);
    const selScreen = document.getElementById('selectionScreen');
    selScreen.innerHTML = `
      <div class="group-banner" style="--gc:${g.color}">
        <div class="group-banner-top"><div><h2>${g.label}</h2><p>${g.sub}</p></div><div class="progress-pill" id="selCount">${selectedIds.size} seleccionados</div></div>
      </div>
      <div id="selectionList"></div>
      <div class="bottom-actions">
        <button class="btn-secondary" id="selCancelBtn">Cancelar</button>
        <button class="btn-primary" style="background:${g.color}" id="selSaveBtn">Guardar sesión</button>
      </div>`;
    selScreen.style.setProperty('--gc', g.color);

    const list = document.getElementById('selectionList');
    let lastSubgroup = null, lastEquip = null;
    defs.forEach(ex => {
      if(ex.subgroup !== lastSubgroup){
        const h = document.createElement('div');
        h.className = 'muscle-header';
        h.style.setProperty('--gc', g.color);
        h.textContent = ex.subgroup;
        list.appendChild(h);
        lastSubgroup = ex.subgroup; lastEquip = null;
      }
      if(ex.equip !== lastEquip){
        const eh = document.createElement('div');
        eh.className = 'equip-header';
        eh.textContent = EQUIP_LABELS[ex.equip] || ex.equip;
        list.appendChild(eh);
        lastEquip = ex.equip;
      }
      const row = document.createElement('div');
      const isChecked = selectedIds.has(ex.id);
      row.className = 'select-row' + (isChecked ? ' checked-row' : '');
      row.style.setProperty('--gc', g.color);
      row.innerHTML = `
        <div class="checkbox ${isChecked?'checked':''}">${isChecked?'✓':''}</div>
        <div class="ex-headtext">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-muscles"><span class="tag tag-primary">${ex.primary}</span>${ex.secondary?`<span class="tag tag-secondary">${ex.secondary}</span>`:''}</div>
        </div>`;
      row.addEventListener('click', () => {
        const nowChecked = !selectedIds.has(ex.id);
        if(nowChecked) selectedIds.add(ex.id); else selectedIds.delete(ex.id);
        row.classList.toggle('checked-row', nowChecked);
        const cb = row.querySelector('.checkbox');
        cb.classList.toggle('checked', nowChecked);
        cb.textContent = nowChecked ? '✓' : '';
        document.getElementById('selCount').textContent = `${selectedIds.size} seleccionados`;
      });
      list.appendChild(row);
    });

    document.getElementById('selCancelBtn').addEventListener('click', () => {
      if(selectionState.editingId) goToSession(selectionState.dateStr, selectionState.editingId);
      else goToCalendar();
    });
    document.getElementById('selSaveBtn').addEventListener('click', saveSelection);
  }

  function saveSelection(){
    const { dateStr, group, editingId, selectedIds } = selectionState;
    if(selectedIds.size === 0){ alert('Selecciona al menos un ejercicio.'); return; }
    const defs = getAllExercisesForGroup(group);
    let existing = null;
    if(editingId){ try{ existing = JSON.parse(storageGet(sessionKey(dateStr, editingId))); }catch(e){} }
    const exercises = defs.filter(d => selectedIds.has(d.id)).map(d => {
      const prev = existing && existing.exercises.find(e => e.id === d.id);
      return { id:d.id, name:d.name, primary:d.primary, secondary:d.secondary, subgroup:d.subgroup, equip:d.equip,
        checked: prev ? prev.checked : false, series: prev ? prev.series : '', reps: prev ? prev.reps : '', peso: prev ? prev.peso : '' };
    });
    const session = existing
      ? { ...existing, exercises, updatedAt: Date.now() }
      : { id:`s${Date.now()}`, date:dateStr, group, name:`Sesión ${GROUPS[group].label}`, exercises, createdAt: Date.now(), updatedAt: Date.now() };
    saveSession(session);
    goToSession(dateStr, session.id);
  }

      const subgroup = subgroupSelect.value;
      const equip = document.getElementById('newEquip').value;
      const name = document.getElementById('newName').value.trim();
      const primary = document.getElementById('newPrimary').value.trim();
      const secondary = document.getElementById('newSecondary').value.trim();
      if(!name || !primary){ alert('Escribe al menos el nombre y el músculo principal.'); return; }
      addCustomExercise(group, subgroup, equip, name, primary, secondary);
      renderManage();
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
      const all = getCustomExercises();
      if(all.length === 0){ alert('Todavía no hay ejercicios personalizados que exportar.'); return; }
      let code = '';
      ['empuje','traccion','pierna'].forEach(gKey => {
        SUBGROUPS_BY_GROUP[gKey].forEach(sgName => {
          ['maquina','libre','calistenia'].forEach(equip => {
            const items = all.filter(c => c.group === gKey && c.subgroup === sgName && c.equip === equip);
            if(items.length === 0) return;
            code += `// ${GROUPS[gKey].label.toUpperCase()} → ${sgName} → ${EQUIP_LABELS[equip]}  (pega dentro de subgroups → "${sgName}" → groups.${equip})\n`;
            items.forEach(c => {
              code += `['${c.name.replace(/'/g,"\\'")}','${c.primary.replace(/'/g,"\\'")}','${(c.secondary||'').replace(/'/g,"\\'")}'],\n`;
            });
            code += '\n';
          });
        });
      });
      document.getElementById('exportText').value = code.trim();
      document.getElementById('exportBox').style.display = 'block';
    });

    const copyBtn = document.getElementById('copyBtn');
    if(copyBtn){
      copyBtn.addEventListener('click', () => {
        const ta = document.getElementById('exportText');
        ta.select();
        try{ navigator.clipboard.writeText(ta.value); copyBtn.textContent = 'Copiado ✓'; setTimeout(() => copyBtn.textContent = 'Copiar al portapapeles', 1500); }
        catch(e){ document.execCommand('copy'); }
      });
    }
  }

  function renderWorkout(){
    const g = GROUPS[currentGroup];
    const total = currentData.exercises.length;
    const doneCount = currentData.exercises.filter(e=>e.checked).length;
    const lastValues = {};
    currentData.exercises.forEach(ex => {
      const raw = storageGet(`last:${ex.id}`);
      if(raw){ try{ lastValues[ex.id] = JSON.parse(raw); }catch(e){} }
    });

    const muscleSet = new Set();
    currentData.exercises.forEach(ex => {
      [ex.primary, ex.secondary].forEach(m => { if(m){ m.split(',').forEach(t => { const v = t.trim(); if(v) muscleSet.add(v); }); } });
    });
    const muscleOptions = Array.from(muscleSet).sort((a,b) => a.localeCompare(b, 'es'));

    workoutScreen.innerHTML = `
      <div class="group-banner" style="--gc:${g.color}">
        <div class="group-banner-top"><div><h2>${g.label}</h2><p>${g.sub}</p></div><div class="progress-pill" id="progressPill">${doneCount}/${total}</div></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:${(total? doneCount/total*100 : 0)}%"></div></div>
      </div>
      <div class="list-toolbar">
        <select class="muscle-filter" id="muscleFilter">
          <option value="">Filtrar por músculo · Todos</option>
          ${muscleOptions.map(m => `<option value="${m}">${m}</option>`).join('')}
        </select>
        <button class="toggle-all" id="toggleAllBtn">Expandir todo</button>
      </div>
      <div id="exerciseList"></div>
      <div class="bottom-actions">
        <button class="btn-secondary" id="editExBtn">Editar ejercicios</button>
        <button class="btn-primary" style="background:${g.color}" id="finishBtn">Guardar y volver</button>
      </div>
      <button class="delete-session-btn" id="deleteSessionBtn">Eliminar sesión</button>`;
    workoutScreen.style.setProperty('--gc', g.color);

    const list = document.getElementById('exerciseList');
    let lastSubgroup = null, lastEquip = null;
    currentData.exercises.forEach(ex => {
      if(ex.subgroup && ex.subgroup !== lastSubgroup){
        const h = document.createElement('div');
        h.className = 'muscle-header';
        h.style.setProperty('--gc', g.color);
        h.textContent = ex.subgroup;
        list.appendChild(h);
        lastSubgroup = ex.subgroup;
        lastEquip = null;
      }
      if(ex.equip && ex.equip !== lastEquip){
        const eh = document.createElement('div');
        eh.className = 'equip-header';
        eh.textContent = EQUIP_LABELS[ex.equip] || ex.equip;
        list.appendChild(eh);
        lastEquip = ex.equip;
      }
      const card = document.createElement('div');
      card.className = 'exercise-card';
      card.style.setProperty('--gc', g.color);
      card.dataset.muscles = [ex.primary, ex.secondary].filter(Boolean).join(',').toLowerCase();
      const last = lastValues[ex.id];
      const lastText = last ? `Última vez: ${last.series||'–'}x${last.reps||'–'} · ${last.peso||'–'} kg` : 'Sin registros previos';
      const muscleTags = `<span class="tag tag-primary">${ex.primary}</span>${ex.secondary ? `<span class="tag tag-secondary">${ex.secondary}</span>` : ''}`;
      card.innerHTML = `
        <div class="ex-head" data-role="toggle">
          <span class="chevron">▾</span>
          <div class="checkbox ${ex.checked?'checked':''}" data-id="${ex.id}" data-role="check">${ex.checked?'✓':''}</div>
          <div class="ex-headtext">
            <div class="ex-name">${ex.name}</div>
            <div class="ex-muscles">${muscleTags}</div>
            <div class="ex-last">${lastText}</div>
          </div>
        </div>
        <div class="ex-details-wrap"><div class="ex-details-inner"><div class="ex-details">
          <div class="ex-body">
            <div class="ex-fields">
              <div class="field"><label>Series</label><input type="number" inputmode="numeric" min="0" data-id="${ex.id}" data-role="series" value="${ex.series}"></div>
              <div class="field"><label>Reps</label><input type="number" inputmode="numeric" min="0" data-id="${ex.id}" data-role="reps" value="${ex.reps}"></div>
              <div class="field"><label>Peso (kg)</label><input type="number" inputmode="decimal" min="0" step="0.5" data-id="${ex.id}" data-role="peso" value="${ex.peso}"></div>
            </div>
            <div class="ex-actions"><button class="rest-trigger" data-role="rest">⏱ Descanso ${restSeconds}s</button></div>
          </div>
        </div></div></div>`;
      list.appendChild(card);

      card.querySelector('[data-role="toggle"]').addEventListener('click', (e) => {
        if(e.target.dataset.role === 'check') return;
        card.classList.toggle('open');
      });
      card.querySelector('[data-role="check"]').addEventListener('click', (e) => {
        e.stopPropagation();
        const exObj = currentData.exercises.find(x => x.id === ex.id);
        exObj.checked = !exObj.checked;
        const cb = e.currentTarget;
        cb.classList.toggle('checked', exObj.checked);
        cb.textContent = exObj.checked ? '✓' : '';
        const done = currentData.exercises.filter(x=>x.checked).length;
        document.getElementById('progressPill').textContent = `${done}/${total}`;
        document.getElementById('progressFill').style.width = `${(total? done/total*100 : 0)}%`;
        scheduleSave();
      });
      card.querySelectorAll('input').forEach(el => {
        el.addEventListener('click', (e) => e.stopPropagation());
        el.addEventListener('input', () => {
          const exObj = currentData.exercises.find(x => x.id === ex.id);
          exObj[el.dataset.role] = el.value;
          scheduleSave();
        });
      });
      card.querySelector('[data-role="rest"]').addEventListener('click', (e) => { e.stopPropagation(); startRest(ex.name); });
    });

    document.getElementById('muscleFilter').addEventListener('change', (e) => {
      const val = e.target.value.toLowerCase();
      document.querySelectorAll('#exerciseList .exercise-card').forEach(c => {
        c.style.display = (!val || c.dataset.muscles.includes(val)) ? '' : 'none';
      });
      // hide any header (muscle or equipment) followed by no visible card before the next header
      const children = Array.from(list.children);
      children.forEach((el, idx) => {
        if(el.classList.contains('muscle-header') || el.classList.contains('equip-header')){
          let hasVisible = false;
          for(let j = idx+1; j < children.length; j++){
            const sib = children[j];
            if(sib.classList.contains('muscle-header')) break;
            if(sib.classList.contains('equip-header') && el.classList.contains('equip-header')) break;
            if(sib.classList.contains('exercise-card') && sib.style.display !== 'none'){ hasVisible = true; break; }
          }
          el.style.display = hasVisible ? '' : 'none';
        }
      });
    });

    document.getElementById('toggleAllBtn').addEventListener('click', () => {
      allOpen = !allOpen;
      document.querySelectorAll('.exercise-card').forEach(c => c.classList.toggle('open', allOpen));
      document.getElementById('toggleAllBtn').textContent = allOpen ? 'Colapsar todo' : 'Expandir todo';
    });

    document.getElementById('finishBtn').addEventListener('click', () => { persistWorkout(); goToCalendar(); });
    document.getElementById('editExBtn').addEventListener('click', () => { persistWorkout(); goToSelection(currentDate, currentGroup, currentData.id); });
    document.getElementById('deleteSessionBtn').addEventListener('click', () => {
      if(confirm(`¿Eliminar "${currentData.name}"?`)){ deleteSession(currentDate, currentData.id); goToCalendar(); }
    });
  }

  function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(persistWorkout, 400); }

  function persistWorkout(){
    currentData.updatedAt = Date.now();
    saveSession(currentData);
    currentData.exercises.forEach(ex => {
      if(ex.series || ex.reps || ex.peso){
        storageSet(`last:${ex.id}`, JSON.stringify({ series: ex.series, reps: ex.reps, peso: ex.peso, date: currentDate }));
      }
    });
  }

  // ---------------- backup / restore / wipe ----------------
  const APP_NAME = 'Rutina-Gimnasio';
  const APP_SLUG = 'rutina-gimnasio';
  const APP_VERSION = '1.0';

  function showToast(msg, isError){
    const existing = document.querySelector('.toast');
    if(existing) existing.remove();
    const t = document.createElement('div');
    t.className = 'toast';
    if(isError) t.style.borderColor = 'rgba(255,97,97,.5)';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  }

  function todayFileDate(){
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  function exportAllData(){
    try{
      const data = {};
      Object.keys(localStorage).forEach(k => { data[k] = localStorage.getItem(k); });
      const backup = { app: APP_NAME, version: APP_VERSION, exportedAt: new Date().toISOString(), data };
      const json = JSON.stringify(backup, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${APP_SLUG}-copia-${todayFileDate()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Copia de seguridad descargada ✓');
    }catch(e){
      console.warn('export failed', e);
      showToast('No se pudo generar la copia de seguridad.', true);
    }
  }

  function importAllData(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try{ parsed = JSON.parse(reader.result); }
      catch(e){ showToast('El archivo no es un JSON válido.', true); return; }

      if(!parsed || typeof parsed !== 'object' || parsed.app !== APP_NAME || !parsed.data || typeof parsed.data !== 'object'){
        showToast('Este archivo no es una copia de seguridad válida de ' + APP_NAME + '.', true);
        return;
      }
      if(!confirm('Se reemplazarán los datos actuales. ¿Continuar?')) return;

      try{
        localStorage.clear();
        Object.keys(parsed.data).forEach(k => { localStorage.setItem(k, parsed.data[k]); });
        showToast('Copia restaurada correctamente ✓');
        setTimeout(() => location.reload(), 900);
      }catch(e){
        console.warn('import failed', e);
        showToast('No se pudo restaurar la copia de seguridad.', true);
      }
    };
    reader.onerror = () => showToast('No se pudo leer el archivo.', true);
    reader.readAsText(file);
  }

  function wipeAllData(){
    if(!confirm('¿Seguro que quieres borrar todos los datos de la app? Esta acción no se puede deshacer.')) return;
    if(!confirm('Última confirmación: se borrarán todas las sesiones, el historial y los ejercicios personalizados. ¿Confirmas el borrado definitivo?')) return;
    try{
      localStorage.clear();
      showToast('Todos los datos se han borrado.');
      setTimeout(() => location.reload(), 900);
    }catch(e){
      console.warn('wipe failed', e);
      showToast('No se pudieron borrar los datos.', true);
    }
  }

  function renderSettings(){
    const settingsScreen = document.getElementById('settingsScreen');
    settingsScreen.innerHTML = `
      <p class="settings-hint">Los datos de esta app (sesiones, historial y ejercicios personalizados) se guardan solo en este navegador, en este dispositivo. No se sincronizan con ningún servidor. Conviene descargar una copia de seguridad con regularidad — por ejemplo, antes de cambiar de móvil, de navegador o de ubicación del archivo.</p>

      <div class="manage-section">
        <h3>Descargar copia de seguridad</h3>
        <p class="empty-hint" style="padding-top:0;">Genera un archivo .json con todos tus datos actuales.</p>
        <button class="btn-add" id="exportBackupBtn">⬇ Descargar copia de seguridad</button>
      </div>

      <div class="manage-section">
        <h3>Restaurar copia de seguridad</h3>
        <p class="empty-hint" style="padding-top:0;">Selecciona un archivo .json exportado previamente desde esta misma app.</p>
        <button class="btn-export" id="importBackupBtn">⬆ Restaurar desde archivo</button>
      </div>

      <div class="manage-section danger-zone">
        <h3>Zona de peligro</h3>
        <p class="empty-hint" style="padding-top:0;">Borra permanentemente todas las sesiones, el historial y los ejercicios personalizados de esta app.</p>
        <button class="btn-delete-all" id="wipeAllBtn">Borrar todos los datos</button>
      </div>`;

    document.getElementById('exportBackupBtn').addEventListener('click', exportAllData);
    document.getElementById('importBackupBtn').addEventListener('click', () => {
      document.getElementById('importFileInput').click();
    });
    document.getElementById('wipeAllBtn').addEventListener('click', wipeAllData);
  }

  document.getElementById('importFileInput').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    importAllData(file);
    e.target.value = '';
  });

  // ---------------- rest timer ----------------
  const restBar = document.getElementById('restBar');
  const restTimeEl = document.getElementById('restTime');
  const restLabelEl = document.getElementById('restLabel');
  const restToggleBtn = document.getElementById('restToggle');

  function beep(){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), gain = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      o.connect(gain); gain.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.4);
    }catch(e){}
  }
  function renderRestTime(){ const m = Math.floor(restRemaining/60), s = restRemaining % 60; restTimeEl.textContent = `${pad(m)}:${pad(s)}`; }
  function startRest(label){
    restLabelEl.textContent = label ? `Descanso · ${label}` : 'Descanso';
    restRemaining = restSeconds; renderRestTime(); restBar.style.display = 'flex'; playRest();
  }
  function playRest(){
    restRunning = true; restToggleBtn.textContent = '❚❚'; clearInterval(restInterval);
    restInterval = setInterval(() => {
      restRemaining--; renderRestTime();
      if(restRemaining <= 0){ clearInterval(restInterval); restRunning = false; restToggleBtn.textContent = '▶'; beep(); }
    }, 1000);
  }
  function pauseRest(){ restRunning = false; restToggleBtn.textContent = '▶'; clearInterval(restInterval); }
  function stopRest(hide){ clearInterval(restInterval); restRunning = false; if(hide) restBar.style.display = 'none'; }

  restToggleBtn.addEventListener('click', () => { if(restRemaining <= 0){ restRemaining = restSeconds; renderRestTime(); } restRunning ? pauseRest() : playRest(); });
  document.getElementById('restPlus').addEventListener('click', () => { restSeconds = Math.min(180, restSeconds+10); restRemaining = Math.min(180, restRemaining+10); renderRestTime(); });
  document.getElementById('restMinus').addEventListener('click', () => { restSeconds = Math.max(10, restSeconds-10); restRemaining = Math.max(0, restRemaining-10); renderRestTime(); });
  document.getElementById('restClose').addEventListener('click', () => stopRest(true));

  // ---------------- init ----------------
  migrateLegacyWorkouts();
  renderCalendar();
})();
</script>
</body>
</html>
