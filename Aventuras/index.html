<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camino a la Inmortalidad - Xianxia RPG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap">
<style>
    :root { --bg: #111827; --panel: #1F2937; --text: #F3F4F6; --gold: #F59E0B; --red: #EF4444; --green: #10B981; --border: #374151; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Nunito', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: #000; padding: 15px 20px; text-align: center; border-bottom: 2px solid var(--gold); flex: none; }
    header h1 { margin: 0; font-size: 24px; color: var(--gold); font-weight: 900; letter-spacing: 2px; }
    
    .container { display: flex; flex: 1; overflow: hidden; }
    
    /* Panel Izquierdo: Stats e Inventario */
    .sidebar { width: 300px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; padding: 20px; box-sizing: border-box; }
    .stat-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border); }
    .stat-title { font-size: 12px; text-transform: uppercase; color: #9CA3AF; margin-bottom: 5px; font-weight: 700; }
    .stat-value { font-size: 18px; font-weight: 900; margin-bottom: 10px; }
    .bar-bg { background: #374151; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 15px; }
    .bar-fill { height: 100%; transition: width 0.3s; }
    .bar-hp { background: var(--red); }
    .bar-qi { background: var(--gold); }
    
    .inv-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .inv-item button { background: var(--green); color: white; border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    
    /* Panel Derecho: Historia */
    .main-area { flex: 1; display: flex; flex-direction: column; padding: 30px; overflow-y: auto; box-sizing: border-box; }
    .story-text { font-size: 18px; line-height: 1.6; margin-bottom: 40px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    .options-grid { display: grid; gap: 12px; }
    
    .btn-option { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 15px; border-radius: 8px; font-family: inherit; font-size: 16px; text-align: left; cursor: pointer; transition: all 0.2s; }
    .btn-option:hover:not(:disabled) { background: #374151; border-color: var(--gold); transform: translateX(5px); }
    .btn-option:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .log { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border); color: #9CA3AF; font-size: 14px; }
    
    /* Alquimia y Combate Overlays */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; flex-direction: column; }
    .modal.active { display: flex; }
    .modal-content { background: var(--panel); padding: 30px; border-radius: 12px; border: 2px solid var(--gold); max-width: 500px; width: 90%; }
    .craft-btn { background: var(--gold); color: #000; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; margin-top: 10px; cursor: pointer; }
    
    @media (max-width: 768px) {
        .container { flex-direction: column; }
        .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); flex: none; height: 250px; }
    }
</style>
<!-- Cargar los datos externos -->
<script src="Textos/items.js"></script>
<script src="Textos/enemigos.js"></script>
<script src="Textos/historia.js"></script>
</head>
<body>

<header>
    <h1>EL CAMINO DEL CULTIVADOR</h1>
</header>

<div class="container">
    <aside class="sidebar">
        <div class="stat-box">
            <!-- Sistema de Tiempo -->
            <div class="stat-title">Calendario</div>
            <div class="stat-value" id="ui-tiempo" style="font-size:14px; color:var(--green); margin-bottom: 15px;">Día 1 - Mañana (8:00)</div>

            <div class="stat-title">Estado Vital</div>
            <div style="display:flex; justify-content:space-between; font-size:12px;"><span>HP</span><span id="ui-hp">100/100</span></div>
            <div class="bar-bg"><div class="bar-fill bar-hp" id="bar-hp" style="width:100%"></div></div>
            
            <div class="stat-title">Cultivación: <span id="ui-rango" style="color:var(--gold)">Mortal</span></div>
            <div style="display:flex; justify-content:space-between; font-size:12px;"><span>Energía Qi</span><span id="ui-qi">0</span></div>
            <div class="bar-bg"><div class="bar-fill bar-qi" id="bar-qi" style="width:0%"></div></div>
            
            <div class="stat-title">Secta / Jerarquía</div>
            <div class="stat-value" id="ui-secta" style="font-size:14px;">Ninguna - Aspirante</div>
        </div>
        
        <div class="stat-box">
            <div class="stat-title">Bolsa Espacial (Inventario)</div>
            <div id="ui-inventario"></div>
        </div>
    </aside>
    
    <main class="main-area">
        <div class="story-text" id="story-text">Cargando la energía del mundo...</div>
        <div class="options-grid" id="options-area"></div>
        <div class="log" id="game-log"></div>
    </main>
</div>

<!-- Modal Alquimia -->
<div id="modal-alquimia" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--gold); margin-top:0;">Horno de Alquimia</h2>
        <div id="recetas-area"></div>
        <button class="btn-option" style="text-align:center; margin-top:20px;" onclick="cerrarModal()">Salir del Horno</button>
    </div>
</div>

<script>
let player = {
    hp: 100, maxHp: 100,
    qi: 0,
    rangoSecta: 0, 
    secta: "Secta del Dragón Azur",
    inventario: {},
    nodoActual: "inicio",
    dia: 1, 
    hora: 8 
};

function getRangoCultivacion() {
    if (player.qi < 100) return `Condensación de Qi (Nivel ${Math.floor(player.qi/10)+1})`;
    if (player.qi < 1000) return `Espiritual de Qi (Nivel ${Math.floor((player.qi-100)/90)+1})`;
    if (player.qi < 5000) return `Celestial de Qi (Nivel ${Math.floor((player.qi-1000)/400)+1})`;
    return "Dios Marcial";
}

function getRangoSecta() {
    const rangos = ["Aspirante", "Discípulo Común", "Maestro Común", "Maestro Anciano", "Líder Supremo"];
    return rangos[player.rangoSecta];
}

function logMsg(msg) {
    const log = document.getElementById('game-log');
    log.innerHTML = `> ${msg}<br>` + log.innerHTML;
}

function updateUI() {
    // Actualizar Reloj
    let tramo = player.hora >= 19 ? "Noche" : (player.hora >= 13 ? "Tarde" : "Mañana");
    document.getElementById('ui-tiempo').innerText = `Día ${player.dia} - ${tramo} (${player.hora}:00)`;

    // Actualizar HP y Qi
    document.getElementById('ui-hp').innerText = `${player.hp}/${player.maxHp}`;
    document.getElementById('bar-hp').style.width = `${(player.hp/player.maxHp)*100}%`;
    
    document.getElementById('ui-qi').innerText = player.qi;
    let meta = player.qi < 100 ? 100 : (player.qi < 1000 ? 1000 : 5000);
    document.getElementById('bar-qi').style.width = `${(player.qi/meta)*100}%`;
    
    document.getElementById('ui-rango').innerText = getRangoCultivacion();
    document.getElementById('ui-secta').innerText = `${player.secta} - ${getRangoSecta()}`;
    
    // Actualizar Inventario
    let invHtml = '';
    for (let itemId in player.inventario) {
        if (player.inventario[itemId] > 0) {
            let itemDef = DB_ITEMS[itemId];
            invHtml += `<div class="inv-item">
                <span>${player.inventario[itemId]}x ${itemDef.nombre}</span>
                ${itemDef.tipo === 'consumible' ? `<button onclick="consumir('${itemId}')">Usar</button>` : ''}
            </div>`;
        }
    }
    document.getElementById('ui-inventario').innerHTML = invHtml || "<span style='color:#6B7280; font-size:12px;'>Bolsa vacía</span>";
}

function consumir(itemId) {
    if (player.inventario[itemId] > 0) {
        player.inventario[itemId]--;
        let efecto = DB_ITEMS[itemId].efecto;
        if (efecto.stat === 'hp') {
            player.hp = Math.min(player.maxHp, player.hp + efecto.valor);
        } else if (efecto.stat === 'qi') {
            player.qi += efecto.valor;
        }
        logMsg(`Has consumido ${DB_ITEMS[itemId].nombre}.`);
        updateUI();
    }
}

function procesarAccion(opcion) {
    if (opcion.reqItem) {
        if (!player.inventario[opcion.reqItem] || player.inventario[opcion.reqItem] < opcion.reqCant) {
            alert("No tienes los recursos necesarios.");
            return;
        }
    }
    
    if (opcion.accion === "item") {
        player.inventario[opcion.itemId] = (player.inventario[opcion.itemId] || 0) + opcion.cant;
        logMsg(`Obtienes: ${opcion.cant}x ${DB_ITEMS[opcion.itemId].nombre}`);
    } else if (opcion.accion === "perderItem") {
        player.inventario[opcion.itemId] -= opcion.cant;
    } else if (opcion.accion === "stat") {
        if (opcion.stat === "nivelSecta") player.rangoSecta = opcion.valor;
        if (opcion.stat === "qi") player.qi += opcion.valor;
        if (opcion.stat === "maxHp") { 
            player.maxHp += opcion.valor; 
            player.hp = Math.min(player.maxHp, player.hp + opcion.valor); 
        }
        logMsg(`Tu estado ha cambiado.`);
    } else if (opcion.accion === "alquimia") {
        abrirAlquimia();
        return;
    } else if (opcion.accion === "combate") {
        iniciarCombate(opcion.enemigo, opcion.nodoVictoria, opcion.nodoDerrota);
        return;
    } else if (opcion.accion === "reiniciar") {
        location.reload();
        return;
    }

    // Gestionar el paso del tiempo
    if (opcion.tiempo) {
        player.hora += opcion.tiempo;
        if (player.hora >= 24) {
            player.dia += Math.floor(player.hora / 24);
            player.hora = player.hora % 24;
            player.hp = Math.min(player.maxHp, player.hp + 30); 
            logMsg(`Ha amanecido un nuevo día. Descansar restaura 30 HP.`);
        }
    }
    
    updateUI();
    irANodo(opcion.nodoSig);
}

function irANodo(nodoId) {
    player.nodoActual = nodoId;
    const nodo = DB_HISTORIA[nodoId];
    
    document.getElementById('story-text').innerHTML = nodo.texto;
    
    let btnHtml = '';
    nodo.opciones.forEach((opc, index) => {
        let deshabilitado = "";
        let reqTexto = "";
        if (opc.reqItem) {
            let tiene = player.inventario[opc.reqItem] || 0;
            if (tiene < opc.reqCant) {
                deshabilitado = "disabled";
                reqTexto = ` <span style='color:var(--red); font-size:12px;'>(Falta ${DB_ITEMS[opc.reqItem].nombre})</span>`;
            }
        }
        btnHtml += `<button class="btn-option" ${deshabilitado} onclick='procesarAccion(DB_HISTORIA["${nodoId}"].opciones[${index}])'>${opc.texto}${reqTexto}</button>`;
    });
    
    document.getElementById('options-area').innerHTML = btnHtml;
}

function iniciarCombate(enemigoId, nodoVictoria, nodoDerrota) {
    const enemigo = DB_ENEMIGOS[enemigoId];
    logMsg(`¡Empieza el combate contra ${enemigo.nombre}!`);
    
    let ataqueJugador = 2 + (Math.floor(player.qi / 10));
    if (player.inventario["espada_acero"] > 0) ataqueJugador += DB_ITEMS["espada_acero"].ataque;
    else if (player.inventario["espada_madera"] > 0) ataqueJugador += DB_ITEMS["espada_madera"].ataque;

    let defensaJugador = 0;
    if (player.inventario["tunica_seda"] > 0) defensaJugador = 3;

    let hpEnemigo = enemigo.hp;
    
    while (player.hp > 0 && hpEnemigo > 0) {
        hpEnemigo -= ataqueJugador;
        if (hpEnemigo > 0) {
            let danoRecibido = Math.max(1, (enemigo.ataque - Math.floor(player.qi/20) - defensaJugador));
            player.hp -= danoRecibido;
        }
    }
    
    if (player.hp <= 0) {
        logMsg(`Has sido derrotado por ${enemigo.nombre}.`);
        irANodo(nodoDerrota);
    } else {
        logMsg(`¡Has derrotado a ${enemigo.nombre}! Ganas +${enemigo.recompensa.exp} Qi.`);
        player.qi += enemigo.recompensa.exp;
        enemigo.recompensa.items.forEach(it => {
            player.inventario[it.id] = (player.inventario[it.id] || 0) + it.cant;
            logMsg(`Despojas: ${it.cant}x ${DB_ITEMS[it.id].nombre}`);
        });
        updateUI();
        irANodo(nodoVictoria);
    }
}

function abrirAlquimia() {
    document.getElementById('modal-alquimia').classList.add('active');
    let html = '';
    DB_ALQUIMIA.forEach((receta, idx) => {
        let ingredientesTxt = Object.keys(receta.ingredientes).map(k => `${receta.ingredientes[k]}x ${DB_ITEMS[k].nombre}`).join(' + ');
        let puedeCrear = true;
        Object.keys(receta.ingredientes).forEach(k => {
            if ((player.inventario[k] || 0) < receta.ingredientes[k]) puedeCrear = false;
        });
        
        html += `<div style="background:#374151; padding:10px; margin-bottom:10px; border-radius:6px;">
            <strong style="color:var(--green)">${DB_ITEMS[receta.resultado].nombre}</strong><br>
            <span style="font-size:12px; color:#9CA3AF">${receta.desc}</span><br>
            <span style="font-size:12px; color:var(--gold)">Requiere: ${ingredientesTxt}</span>
            <button class="craft-btn" ${!puedeCrear ? 'disabled style="background:#6B7280"' : ''} onclick="fabricar(${idx})">Refinar Píldora</button>
        </div>`;
    });
    document.getElementById('recetas-area').innerHTML = html;
}

function fabricar(idx) {
    let receta = DB_ALQUIMIA[idx];
    Object.keys(receta.ingredientes).forEach(k => {
        player.inventario[k] -= receta.ingredientes[k];
    });
    player.inventario[receta.resultado] = (player.inventario[receta.resultado] || 0) + 1;
    logMsg(`Has refinado con éxito: ${DB_ITEMS[receta.resultado].nombre}.`);
    updateUI();
    abrirAlquimia();
}

function cerrarModal() {
    document.getElementById('modal-alquimia').classList.remove('active');
    irANodo(player.nodoActual); 
}

window.onload = () => {
    updateUI();
    irANodo("inicio");
};
</script>
</body>
</html>
